# Nginx — 多模态日语词汇学习反向代理
# HTTP → HTTPS 自动跳转，TLS 终端 + 安全头 + gzip

# HTTP — 仅用于 ACME 验证和重定向
server {
    listen 80;
    server_name riyucihuixuexi.cn www.riyucihuixuexi.cn;

    # Let's Encrypt HTTP-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其他所有请求跳转 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — 主服务
server {
    listen 443 ssl http2;
    server_name riyucihuixuexi.cn www.riyucihuixuexi.cn;

    # ── TLS 配置 ──
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── 安全头 ──
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; font-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    # ── 上传限制 ──
    client_max_body_size 10m;

    # ── gzip 压缩 ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        text/xml
        image/svg+xml
        text/html
        text/plain
        font/woff2;

    # ── 前端静态文件（长缓存，配合内容哈希版本号） ──
    location / {
        root /usr/share/nginx/html;
        index index.html;
        # 多页支持（阶段二）：/community → community.html；仍保留 SPA 回退到 index.html
        try_files $uri $uri.html $uri/ /index.html;

        # index.html 不缓存，确保最新版本
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # CSS / JS 文件缓存 1 天（版本号手动管理，index.html 无缓存）
        location ~* \.(css|js)$ {
            expires 1d;
            add_header Cache-Control "public";
        }

        # 图片 / 字体缓存 30 天
        location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 30d;
            add_header Cache-Control "public";
        }
    }

    # ── 后端 API 代理 ──
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # AI 生成超时
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;

        # SSE 流式（打字机效果）：禁止 nginx 缓冲，逐块转发
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
    }
}
