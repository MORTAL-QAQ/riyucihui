# Alembic 迁移配置（#18）
# 实际数据库 URL 由 migrations/env.py 从 app.config 读取（兼容 SQLite/PostgreSQL/Docker secrets），
# 此处仅作占位。
[alembic]
script_location = migrations
prepend_sys_path = .
# 占位；env.py 会用 app.config.DATABASE_URL 覆盖
sqlalchemy.url = sqlite:///./data/words.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
