# AIGC多模态日语词汇学习 — Docker 部署
#
# === 快速启动（自签名证书，仅测试用） ===
#   bash cert-setup.sh self-signed
#   docker compose up -d
#   访问 https://<服务器IP> （浏览器会提示不安全，点击继续）
#
# === 生产部署（Let's Encrypt 正式证书） ===
#   1. 确保域名 DNS 已指向本服务器
#   2. 编辑 cert-setup.sh，设置 DOMAIN=your-domain.com
#   3. bash cert-setup.sh production
#   4. 复制 .env.production 为 .env 并填入真实密钥
#   5. docker compose up -d
#   证书到期前自动续期: docker compose run --rm certbot renew
#
# === 其他命令 ===
#   停止: docker compose down
#   日志: docker compose logs -f
#   创建管理员: docker compose exec backend python -m app.cli create-admin <用户名> <密码>
#
# === 本地开发注意事项 ===
#   VOICEVOX 引擎在宿主机运行（端口 50021），backend 通过 host.docker.internal 访问
#   生产部署时 VOICEVOX 已容器化，无需额外配置
#
# === 密钥管理（Docker secrets） ===
#   敏感值（SECRET_KEY / DEEPSEEK_API_KEY / VOLCANO_API_KEY / DB_PASSWORD / DATABASE_URL）
#   通过 secrets/ 目录下的文件注入，容器内挂载为 /run/secrets/<键名>，不落入 environment。
#   部署前请确认 secrets/ 目录存在且包含真实值（本地模板见 secrets/README.md）。

services:
  voicevox:
    image: voicevox/voicevox_engine:cpu-ubuntu20.04-latest
    container_name: jp-vocab-voicevox
    expose:
      - "50021"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/python/bin/python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:50021/version')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  postgres:
    image: postgres:16-alpine
    container_name: jp-vocab-db
    expose:
      - "5432"
    environment:
      POSTGRES_USER: jpvocab
      POSTGRES_PASSWORD_FILE: /run/secrets/DB_PASSWORD
      POSTGRES_DB: jpvocab
    secrets:
      - DB_PASSWORD
    command: |
      -c shared_buffers=32MB
      -c work_mem=2MB
      -c max_connections=20
      -c maintenance_work_mem=16MB
      -c effective_cache_size=512MB
      -c wal_buffers=4MB
      -c max_wal_size=256MB
      -c bgwriter_lru_maxpages=50
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jpvocab"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: .
    container_name: jp-vocab-backend
    mem_limit: 512M
    expose:
      - "8000"
    volumes:
      - backend_data:/app/data
    environment:
      - VOICEVOX_BASE_URL=http://voicevox:50021
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    secrets:
      - SECRET_KEY
      - DEEPSEEK_API_KEY
      - VOLCANO_API_KEY
      - DB_PASSWORD
      - DATABASE_URL
    depends_on:
      postgres:
        condition: service_healthy
      voicevox:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: jp-vocab-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
      - ./certs:/etc/nginx/certs:ro
      - certbot_webroot:/var/www/certbot
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      # 探测 backend 健康端点（经 nginx 反代），backend 或 nginx 任一异常即 unhealthy（#24）
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  certbot:
    image: certbot/certbot:latest
    container_name: jp-vocab-certbot
    volumes:
      - ./certs:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    entrypoint: ["/bin/true"]
    restart: "no"
    profiles:
      - certbot

secrets:
  SECRET_KEY:
    file: ./secrets/SECRET_KEY
    mode: "0444"  # 非 root 容器用户（appuser）需可读（#8）
  DEEPSEEK_API_KEY:
    file: ./secrets/DEEPSEEK_API_KEY
    mode: "0444"
  VOLCANO_API_KEY:
    file: ./secrets/VOLCANO_API_KEY
    mode: "0444"
  DB_PASSWORD:
    file: ./secrets/DB_PASSWORD
    mode: "0444"
  DATABASE_URL:
    file: ./secrets/DATABASE_URL
    mode: "0444"

volumes:
  pgdata:
  backend_data:
  certbot_webroot:
