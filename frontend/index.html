<!doctype html>
<!--
  多模态日语词汇学习 — 单页面应用（SPA）

  页面结构：
  - 认证层（auth-page）：登录/注册
  - 主界面（main-app）：登录后可见
    - 侧边栏导航（sidebar）
    - 主内容区（main）：包含 10 个页面（page）
      - 生成单词 / 词库 / 背词 / 短文 / 完型填空 / 语法 / 我的保存 / 成就 / 设置 / 管理

  版本标识（由后端注入）：
  - {style_version}, {api_version}, {app_version} 用于前端资源缓存控制
-->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>多模态日语词汇学习</title>
    <link rel="stylesheet" href="/css/desktop.css?v={desktop_version}" />
    <link rel="stylesheet" href="/css/mobile.css?v={mobile_version}" media="(max-width: 768px)" />
  </head>
  <body>
    <!-- ===== 登录/注册页面（初始隐藏，JS 按登录态决定显示） ===== -->
    <div class="auth-overlay" id="auth-page" style="display:none">
      <div class="auth-container">
        <div class="auth-brand">
          <div class="auth-brand-icon">あ</div>
          <div class="auth-brand-title">たのしい にほんご</div>
          <div class="auth-brand-sub">多模态日语词汇学习</div>
        </div>
        <div class="auth-panel">
          <div class="auth-panel-header">
            <h2 class="auth-panel-title" id="auth-title">登录</h2>
          </div>
          <div class="auth-fields">
            <input
              type="text"
              id="auth-name"
              class="auth-field-input"
              placeholder="用户名（昵称）"
              autocomplete="nickname"
              style="display: none"
            />
            <input
              type="text"
              id="auth-username"
              class="auth-field-input"
              placeholder="账号"
              autocomplete="username"
            />
            <input
              type="password"
              id="auth-password"
              class="auth-field-input"
              placeholder="密码"
              autocomplete="current-password"
            />
          </div>
          <div class="auth-msg" id="auth-error"></div>
          <button class="auth-submit" id="btn-auth-submit">登 录</button>
          <div class="auth-foot">
            <span id="auth-switch-text">还没有帐号？</span>
            <button class="auth-switch-btn" id="btn-auth-switch">立即注册</button>
          </div>
        </div>
      </div>
    </div>

    <div id="app">
      <!-- 主界面（登录后可见） -->
      <div id="main-app" style="display: none">
        <!-- 侧边栏 -->
        <!-- 移动端专属元素：桌面端完全隐藏 -->
        <div class="mobile-only">
          <button class="hamburger" id="hamburger-btn" aria-label="菜单">☰</button>
          <div class="sidebar-overlay" id="sidebar-overlay"></div>
          <div class="mobile-bottom-nav" id="mobile-bottom-nav">
            <button data-tab="study"><span class="mb-icon">📝</span>学习</button>
            <button data-tab="wordbank"><span class="mb-icon">📖</span>词库</button>
            <button data-tab="generate" class="active"><span class="mb-icon">✦</span>生成</button>
            <button data-tab="essay"><span class="mb-icon">📄</span>短文</button>
            <button data-tab="more" id="btn-more-menu"><span class="mb-icon">⋯</span>更多</button>
          </div>
          <div class="more-menu-overlay" id="more-menu-overlay"></div>
          <div class="more-menu-popup" id="more-menu-popup">
            <button data-tab="home"><span class="mb-icon">🏠</span>首页</button>
            <button data-tab="cloze"><span class="mb-icon">📝</span>完型填空</button>
            <button data-tab="grammar"><span class="mb-icon">📐</span>语法</button>
            <button data-tab="image"><span class="mb-icon">📷</span>图片词卡</button>
            <button data-tab="community"><span class="mb-icon">💬</span>社区</button>
            <button data-tab="achievement"><span class="mb-icon">🏆</span>成就</button>
            <button data-tab="saved"><span class="mb-icon">📋</span>我的保存</button>
            <button data-tab="settings"><span class="mb-icon">⚙</span>设置</button>
          </div>
        </div>
        <aside class="sidebar">
          <div class="logo">
            <span class="logo-icon">あ</span>
            <span class="logo-text">多模态日语词汇学习</span>
          </div>
          <div class="sidebar-greeting">
            <span class="sidebar-greeting-emoji">👋</span>
            <span>日本語の世界へようこそ！</span>
            <span class="sidebar-greeting-kao">Hi~ o(*￣▽￣*)ブ</span>
          </div>
          <nav class="nav">
            <button class="nav-btn active" data-tab="home" id="nav-home">
              <span class="nav-icon">🏠</span> 首页
            </button>
            <button class="nav-btn" data-tab="wordbank" id="nav-wordbank">
              <span class="nav-icon">📖</span> 我的词库
            </button>
            <button class="nav-btn" data-tab="study" id="nav-study">
              <span class="nav-icon">📝</span> 背词
              <span class="nav-badge" id="study-badge" style="display: none">0</span>
            </button>
            <button class="nav-btn" data-tab="generate" id="nav-generate">
              <span class="nav-icon">✦</span> 生成单词
            </button>
            <button class="nav-btn" data-tab="essay" id="nav-essay">
              <span class="nav-icon">📄</span> 短文
            </button>
            <button class="nav-btn" data-tab="cloze" id="nav-cloze">
              <span class="nav-icon">📝</span> 完型填空
            </button>
            <button class="nav-btn" data-tab="grammar" id="nav-grammar">
              <span class="nav-icon">📐</span> 语法
            </button>
            <button class="nav-btn" data-tab="image" id="nav-image">
              <span class="nav-icon">📷</span> 图片词卡
            </button>
            <button class="nav-btn" data-tab="community" id="nav-community">
              <span class="nav-icon">💬</span> 社区
            </button>
            <button class="nav-btn" data-tab="achievement" id="nav-achievement">
              <span class="nav-icon">🏆</span> 成就
            </button>
            <button class="nav-btn" data-tab="saved" id="nav-saved">
              <span class="nav-icon">📋</span> 我的保存
            </button>
            <button class="nav-btn" data-tab="settings" id="nav-settings">
              <span class="nav-icon">⚙</span> 设置
            </button>
            <button class="nav-btn" data-tab="admin" id="nav-admin" style="display: none">
              <span class="nav-icon">🛡</span> 管理
            </button>
          </nav>
          <div class="sidebar-footer">
            <div class="user-info" id="sidebar-user">
              <span class="user-icon">👤</span>
              <span class="user-name" id="sidebar-username"></span>
            </div>
            <button class="btn btn-link btn-logout" id="btn-logout">退出登录</button>
            <div class="api-status" id="api-status">
              <span class="status-dot"></span> API 未检测
            </div>
          </div>
        </aside>

        <!-- 页面加载指示器 -->
        <div class="page-loader" id="page-loader" style="display:none">
          <div class="page-loader-spinner"></div>
          <span class="page-loader-text">加载中...</span>
        </div>

        <!-- 主内容区 -->
        <main class="main">
          <!-- 首页（学习仪表盘） -->
          <section class="page active" id="page-home">
            <!-- 顶部区：欢迎横幅（左） + 签到卡片（右上） -->
            <div class="home-top">
              <div class="home-welcome">
                <div class="home-welcome-emoji">🌸</div>
                <div class="home-welcome-text">
                  <h1 class="home-welcome-title" id="home-welcome-title">こんにちは</h1>
                  <p class="home-welcome-sub" id="home-welcome-sub">今天也要一起加油学习日语哦</p>
                  <div class="home-welcome-date" id="home-welcome-date"></div>
                </div>
                <a class="home-welcome-cta" href="/study">📝 开始学习</a>
                <!-- 装饰性漂浮假名（填满右侧留白） -->
                <span class="home-welcome-deco d1">あ</span>
                <span class="home-welcome-deco d2">い</span>
                <span class="home-welcome-deco d3">う</span>
                <span class="home-welcome-deco d4">日本語</span>
              </div>

              <!-- 每日签到卡片（右上） -->
              <div class="home-checkin" id="home-checkin">
                <div class="home-checkin-head">
                  <span class="home-checkin-title">📅 每日签到</span>
                  <span class="home-checkin-streak" id="checkin-streak">🔥 连续 0 天</span>
                </div>
                <button class="home-checkin-btn" id="btn-checkin" type="button">签到</button>
                <div class="home-checkin-word">
                  <div class="home-checkin-word-label">💡 每日推荐单词</div>
                  <div class="home-checkin-word-body">
                    <span class="home-checkin-word-jp" id="checkin-word-jp">-</span>
                    <span class="home-checkin-word-kana" id="checkin-word-kana"></span>
                    <span class="home-checkin-word-cn" id="checkin-word-cn"></span>
                    <button class="btn btn-outline btn-sm" id="btn-checkin-word-speak" title="发音">🔊</button>
                  </div>
                </div>
                <div class="home-checkin-foot">
                  <span class="home-checkin-hint">签到后自动加入「签到单词」词单</span>
                  <a class="home-checkin-link" href="/wordbank">词单 →</a>
                </div>
              </div>
            </div>

            <!-- 学习统计卡片 -->
            <div class="home-stats">
              <div class="home-stat-card">
                <span class="home-stat-icon">📚</span>
                <div class="home-stat-num" id="stat-due">-</div>
                <div class="home-stat-label">今日待复习</div>
              </div>
              <div class="home-stat-card">
                <span class="home-stat-icon">✨</span>
                <div class="home-stat-num" id="stat-new">-</div>
                <div class="home-stat-label">可学新词</div>
              </div>
              <div class="home-stat-card">
                <span class="home-stat-icon">🔥</span>
                <div class="home-stat-num" id="stat-streak">-</div>
                <div class="home-stat-label">连续学习(天)</div>
              </div>
              <div class="home-stat-card">
                <span class="home-stat-icon">🎯</span>
                <div class="home-stat-num" id="stat-learned">-</div>
                <div class="home-stat-label">累计已学</div>
              </div>
            </div>

            <!-- 最新公告 -->
            <div class="home-announcements" id="home-announcements" style="display:none"></div>

            <!-- 每日一言 + 推荐词 -->
            <div class="home-daily">
              <div class="home-daily-title">📜 每日一言</div>
              <div class="home-daily-jp" id="home-daily-jp"></div>
              <div class="home-daily-cn" id="home-daily-cn"></div>
              <div class="home-daily-actions">
                <button class="btn btn-outline btn-sm" id="btn-home-daily-speak">🔊 发音</button>
              </div>
              <div class="home-recommend" id="home-recommend" style="display:none">
                <div class="home-recommend-label">💡 推荐词</div>
                <div class="home-recommend-body">
                  <span class="home-recommend-word" id="home-recommend-word"></span>
                  <span class="home-recommend-kana" id="home-recommend-kana"></span>
                  <span class="home-recommend-cn" id="home-recommend-cn"></span>
                  <button class="btn btn-outline btn-sm" id="btn-home-recommend-speak">🔊</button>
                </div>
              </div>
            </div>
          </section>

          <!-- 生成单词页面已迁移至独立子页 /generate（阶段二多页架构） -->

          <!-- 词库页面已迁移至独立子页 /wordbank（阶段二多页架构） -->

          <!-- 背词页面已迁移至独立子页 /study（阶段二多页架构） -->

          <!-- 短文页面已迁移至独立子页 /essay（阶段二多页架构） -->

          <!-- 完型填空页面已迁移至独立子页 /cloze（阶段二多页架构） -->

          <!-- 图片词卡页面已迁移至独立子页 /image（阶段二多页架构） -->

          <!-- 语法页面已迁移至独立子页 /grammar（阶段二多页架构） -->

          <!-- PDF 导出对话框已迁移至独立子页 /wordbank（阶段二多页架构） -->

          <!-- 社区帖子详情模态框已迁移至独立页 /community（阶段二多页架构） -->
        </main>
      </div>
      <!-- #main-app -->
    </div>
    <!-- #app -->

    <footer class="site-footer">
      <a href="http://www.beian.gov.cn/portal/registerSystemInfo?recordcode=42280202423028" target="_blank" rel="noopener">
        <img src="/img/beian.png" style="vertical-align:middle;margin-right:4px;width:16px;height:16px" alt="">鄂公网安备42280202423028号
      </a>
      <span style="margin:0 8px;color:var(--border)">|</span>
      <a href="http://beian.miit.gov.cn/" target="_blank" rel="noopener">鄂ICP备2026038430号</a>
    </footer>

    <script src="/js/api.js?v={api_version}"></script>
    <script src="/js/common.js?v={app_version}"></script>
    <script src="/js/app.js?v={app_version}"></script>
  </body>
</html>
