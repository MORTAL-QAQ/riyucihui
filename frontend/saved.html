<!doctype html>
<!--
  多模态日语词汇学习 — 我的保存独立子页（阶段二多页架构）
  页面逻辑在 js/saved.js
-->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>我的保存 - 多模态日语词汇学习</title>
    <link rel="stylesheet" href="/css/desktop.css?v={desktop_version}" />
    <link rel="stylesheet" href="/css/mobile.css?v={mobile_version}" media="(max-width: 768px)" />
  </head>
  <body class="subpage" style="margin:0;">
    <div id="app" style="display:block; min-height:100vh;">
      <div id="main-app">
        <header class="subpage-header"
                style="position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:10px; padding:10px 20px; background:linear-gradient(135deg,#1a1a2e,#2d2a4a);">
          <div style="flex:1; display:flex; align-items:center; min-width:0;">
            <a href="/" style="display:inline-flex; align-items:center; gap:8px; text-decoration:none;">
              <span style="width:30px; height:30px; border-radius:8px; background:linear-gradient(135deg,#6366f1,#8b5cf6); color:#fff; display:inline-flex; align-items:center; justify-content:center; font-size:16px; font-weight:700;">あ</span>
              <span style="color:#fff; font-weight:700; font-size:15px; white-space:nowrap;">日语学习</span>
            </a>
          </div>
          <div class="subpage-nav-scroll" style="display:flex; align-items:center; gap:6px; flex-wrap:wrap; justify-content:center;">
            <a href="/" style="display:inline-flex; align-items:center; gap:6px; color:#e5e7eb; text-decoration:none; font-size:14px; font-weight:600; padding:7px 14px; border-radius:999px; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.12);"><span>🏠</span> 返回首页</a>
            <a href="/wordbank" style="display:inline-flex; align-items:center; gap:4px; color:#d5d8e6; text-decoration:none; font-size:13px; padding:7px 12px; border-radius:999px; background:rgba(255,255,255,0.04); border:1px solid transparent;">📖 词库</a>
            <a href="/study" style="display:inline-flex; align-items:center; gap:4px; color:#d5d8e6; text-decoration:none; font-size:13px; padding:7px 12px; border-radius:999px; background:rgba(255,255,255,0.04); border:1px solid transparent;">📝 背词</a>
            <a href="/generate" style="display:inline-flex; align-items:center; gap:4px; color:#d5d8e6; text-decoration:none; font-size:13px; padding:7px 12px; border-radius:999px; background:rgba(255,255,255,0.04); border:1px solid transparent;">✦ 生成</a>
            <a href="/essay" style="display:inline-flex; align-items:center; gap:4px; color:#d5d8e6; text-decoration:none; font-size:13px; padding:7px 12px; border-radius:999px; background:rgba(255,255,255,0.04); border:1px solid transparent;">📄 短文</a>
            <a href="/cloze" style="display:inline-flex; align-items:center; gap:4px; color:#d5d8e6; text-decoration:none; font-size:13px; padding:7px 12px; border-radius:999px; background:rgba(255,255,255,0.04); border:1px solid transparent;">📝 完型</a>
            <a href="/grammar" style="display:inline-flex; align-items:center; gap:4px; color:#d5d8e6; text-decoration:none; font-size:13px; padding:7px 12px; border-radius:999px; background:rgba(255,255,255,0.04); border:1px solid transparent;">📐 语法</a>
            <a href="/image" style="display:inline-flex; align-items:center; gap:4px; color:#d5d8e6; text-decoration:none; font-size:13px; padding:7px 12px; border-radius:999px; background:rgba(255,255,255,0.04); border:1px solid transparent;">📷 图片</a>
            <a href="/community" style="display:inline-flex; align-items:center; gap:4px; color:#d5d8e6; text-decoration:none; font-size:13px; padding:7px 12px; border-radius:999px; background:rgba(255,255,255,0.04); border:1px solid transparent;">💬 社区</a>
            <a href="/achievement" style="display:inline-flex; align-items:center; gap:4px; color:#d5d8e6; text-decoration:none; font-size:13px; padding:7px 12px; border-radius:999px; background:rgba(255,255,255,0.04); border:1px solid transparent;">🏆 成就</a>
            <a href="/saved" style="display:inline-flex; align-items:center; gap:4px; color:#fff; text-decoration:none; font-size:13px; padding:7px 12px; border-radius:999px; background:rgba(99,102,241,0.35); border:1px solid rgba(129,140,248,0.4);">💾 保存</a>
          </div>
          <div style="flex:1; display:flex; align-items:center; justify-content:flex-end; gap:8px; min-width:0;">
            <a href="/settings" style="display:inline-flex; align-items:center; gap:4px; color:#e5e7eb; border:1px solid rgba(255,255,255,0.35); border-radius:8px; padding:6px 12px; font-size:13px; text-decoration:none; background:transparent; white-space:nowrap;">⚙ 设置</a>
            <button id="btn-logout" type="button" style="display:inline-flex; align-items:center; gap:4px; color:#e5e7eb; border:1px solid rgba(255,255,255,0.35); border-radius:8px; padding:6px 12px; font-size:13px; background:transparent; cursor:pointer; white-space:nowrap;">退出</button>
          </div>
        </header>

        <main class="main" style="margin-left:auto; margin-right:auto; max-width:1200px; width:100%; box-sizing:border-box; padding:24px 20px 60px;">
          <section class="page active" id="page-saved">
            <div class="page-header">
              <h1>我的保存</h1>
              <p class="subtitle">已保存的短文、完型填空和语法辨析</p>
            </div>
            <div class="saved-search-bar">
              <input type="text" id="saved-search" class="saved-search-input" placeholder="搜索已保存的内容..." autocomplete="off" />
            </div>

            <div class="study-tabs">
              <button class="study-subtab active" id="saved-subtab-essay">短文</button>
              <button class="study-subtab" id="saved-subtab-cloze">完型填空</button>
              <button class="study-subtab" id="saved-subtab-grammar">语法</button>
            </div>

            <div class="saved-panel" id="saved-panel-essay">
              <div class="essay-saved-list" id="essay-saved-list"></div>
              <div class="empty-state" id="essay-saved-empty" style="display: none">
                <div class="empty-icon">📭</div>
                <p>还没有保存的短文</p>
              </div>
            </div>

            <div class="saved-panel" id="saved-panel-grammar" style="display: none">
              <div class="grammar-saved-list" id="grammar-saved-list"></div>
              <div class="empty-state" id="grammar-saved-empty" style="display: none">
                <div class="empty-icon">📭</div>
                <p>还没有保存的语法辨析</p>
              </div>
            </div>

            <div class="saved-panel" id="saved-panel-cloze" style="display: none">
              <div class="essay-saved-list" id="cloze-saved-list"></div>
              <div class="empty-state" id="cloze-saved-empty" style="display: none">
                <div class="empty-icon">📭</div>
                <p>还没有保存的完型填空</p>
              </div>
            </div>

          </section>
        </main>
      </div>
    </div>

    <!-- 内容查看模态窗 -->
    <div class="modal-overlay" id="content-modal" style="display:none">
      <div class="modal-content saved-modal">
        <div class="modal-header">
          <h3 id="modal-title"></h3>
          <button class="modal-close" id="modal-close">&times;</button>
        </div>
        <div class="modal-body" id="modal-body"></div>
        <div class="modal-footer">
          <button class="btn btn-outline btn-sm" id="modal-btn-delete">删除</button>
          <button class="btn btn-primary btn-sm" id="modal-btn-close">关闭</button>
        </div>
      </div>
    </div>

    <footer class="site-footer">
      <a href="http://www.beian.gov.cn/portal/registerSystemInfo?recordcode=42280202423028" target="_blank" rel="noopener">
        <img src="/img/beian.png" style="vertical-align:middle;margin-right:4px;width:16px;height:16px" alt="">鄂公网安备42280202423028号
      </a>
      <span style="margin:0 8px;color:var(--border)">|</span>
      <a href="http://beian.miit.gov.cn/" target="_blank" rel="noopener">鄂ICP备2026038430号</a>
    </footer>

    <script src="/js/api.js?v={api_version}"></script>
    <script src="/js/common.js?v={app_version}"></script>
    <script src="/js/saved.js?v={app_version}"></script>
  </body>
</html>
